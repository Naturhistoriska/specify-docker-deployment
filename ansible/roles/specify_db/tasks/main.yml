- name: Get secrets based on specify_instance
  set_fact:
    root_password: "{{ installation[specify_instance].root_password }}"
    database: "{{ installation[specify_instance].database }}"
    master_user: "{{ installation[specify_instance].master_user }}"
    master_password: "{{ installation[specify_instance].master_password }}"

- name: Create directory structure on database host
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /data/log
    - /data/backups/{{ specify_instance }}
    - /data/code/{{ specify_instance }}
    - /data/code/{{ specify_instance }}/env
    - /data/code/{{ specify_instance }}/seed-database
    - /data/volumes/database/{{ specify_instance }}
  tags:
    - directory_structure_db

- name: Install env files
  template:
    src: env_file.template.j2
    dest: /data/code/{{ specify_instance }}/env/.env_{{ specify_instance }}
    owner: root
    group: docker
    mode: 0640
  tags:
    - env_files_db

- name: Install docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: /data/code/{{ specify_instance }}/docker-compose.yml
    owner: root
    group: docker
    mode: 0664
  tags:
    - deploy_db
    - docker_compose_db

- name: Setup backup scripts
  template:
    src: backup.sh.j2
    dest: /data/code/{{ specify_instance }}/backupdb_{{ specify_instance }}.sh
    mode: 0775
  tags:
    - backup_script

- name: Ensure a crontab job for backup
  cron:
    name: "backupdb_{{ specify_instance }}"
    minute: "{{ cron_job_minute }}"
    hour: "{{ cron_job_hour }}" # CET
    job: "/data/code/{{ specify_instance }}/backupdb_{{ specify_instance }}.sh >> /data/log/backup_{{ specify_instance }}_nightly.log 2>&1"
  tags:
    - crontab_for_backup
