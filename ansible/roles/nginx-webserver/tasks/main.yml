- name: Create necessary directory structure
  become: true
  file:
    path: "{{ item }}"
    owner: root
    group: docker
    mode: 0775
    state: directory
  with_items:
    - "{{ webserver_code_root }}"
    - "{{ webserver_code_root }}/certs"
    - "{{ webserver_code_root }}/conf.d"
    - "{{ webserver_code_root }}/includes"
  tags:
    - webserver_app_directory

- name: Install includes
  become: true
  copy:
    src: includes/
    dest: "{{ webserver_code_root }}/includes/"
    owner: root
    group: docker
    mode: 0664
  tags:
    - include_configs

- name: Install nginx conf for {{ specify_instance }}
  become: true
  template:
    src: nginx.conf.j2
    dest: "{{ webserver_code_root }}/conf.d/{{ specify_instance }}.conf"
    owner: root
    group: docker
    mode: 0664
  tags:
    - nginx_conf_file

- name: Install docker compose
  become: true
  template:
    src: docker-compose.yml.j2
    dest: "{{ webserver_code_root }}/docker-compose.yml"
    owner: root
    group: docker
    mode: 0664
  tags:
    - docker_compose
