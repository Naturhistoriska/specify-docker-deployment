- name: Create necessary directory structure
  become: true
  file:
    path: "{{ item }}"
    owner: root
    group: docker
    mode: 0775
    state: directory
  with_items:
    - "{{ webserver_code_root }}"
    - "{{ webserver_code_root }}/certs"
    - "{{ webserver_code_root }}/conf.d"
    - "{{ webserver_code_root }}/includes"
  tags:
    - webserver_app_directory

- name: Install includes
  become: true
  copy:
    src: includes/
    dest: "{{ webserver_code_root }}/includes/"
    owner: root
    group: docker
    mode: 0664
  tags:
    - include_configs

- name: Install nginx conf for {{ specify_instance }}
  become: true
  template:
    src: nginx.conf.j2
    dest: "{{ webserver_code_root }}/conf.d/{{ specify_instance }}.conf"
    owner: root
    group: docker
    mode: 0664
  tags:
    - nginx_conf_file

- name: Install docker compose
  become: true
  copy:
    src: docker-compose.yml
    dest: "{{ webserver_code_root }}/docker-compose.yml"
    owner: root
    group: docker
    mode: 0664
    force: true
  tags:
    - docker_compose

- name: Insert a line after a specific pattern
  lineinfile:
    path: "{{ webserver_code_root }}/docker-compose.yml"
    line: "      - static-files-{{ specify_instance }}:/volumes/static-files-{{ specify_instance }}:ro"
    insertafter: "#volume declarations"

- name: Insert another line after a specific pattern
  lineinfile:
    path: "{{ webserver_code_root }}/docker-compose.yml"
    line: "      - specify6-{{ specify_instance }}:/volumes/specify6-{{ specify_instance }}:ro"
    insertafter: "#volume declarations"

- name: Install temp volume def file "volume_definitions-{{ specify_instance }}.yml"
  become: true
  template:
    src: volume_definitions.yml.j2
    dest: "{{ webserver_code_root }}/volume_definitions-{{ specify_instance }}.yml"
    owner: root
    group: docker
    mode: 0664
  tags:
    - volume_definitions_temp

- name: Append content of "volume_definitions-{{ specify_instance }}.yml" to volumes.yml
  ansible.builtin.shell:
    cmd: cat {{ webserver_code_root }}/volume_definitions-{{ specify_instance }}.yml >> {{ webserver_code_root }}/volumes.yml

- name: Append content of generated volumes.yml to docker-compose.yml
  ansible.builtin.shell:
    cmd: cat {{ webserver_code_root }}/volumes.yml >> {{ webserver_code_root }}/docker-compose.yml

- name: Remove temp volume definition file for "{{ specify_instance }}"
  ansible.builtin.file:
    path: "{{ webserver_code_root }}/volume_definitions-{{ specify_instance }}.yml"
    state: absent

- name: Remove volumes.yml file 
  ansible.builtin.file:
    path: "{{ webserver_code_root }}/volumes.yml"
    state: absent
