version: '3.7'
services:

  mariadb:
    restart: unless-stopped
    image: mariadb:10.11
    command: --max_allowed_packet=10737418240
    volumes:
      - "database:/var/lib/mysql"
      - "./seed-database:/docker-entrypoint-initdb.d"
    env_file: ./env/.env_file
    ports:
      - 3306:3306

volumes:
  database: # the data directory for mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/data/volumes/database"
